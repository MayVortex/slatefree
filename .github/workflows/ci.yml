name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test (help output)
        shell: pwsh
        run: |
          $out = & .\target\release\slatefree.exe --help --lang en | Out-String
          if ($out -notmatch 'slatefree') { Write-Error "unexpected help output"; exit 1 }
