name: It works with my gear
description: Tell others which cameras / recorders / Resolve versions slatefree worked with
labels: [compatibility]
body:
  - type: input
    id: cameras
    attributes:
      label: Cameras (model, frame rate, timecode mode)
    validations:
      required: true
  - type: input
    id: recorder
    attributes:
      label: Recorder (model, mode)
    validations:
      required: true
  - type: input
    id: resolve
    attributes:
      label: DaVinci Resolve version and OS
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Event type, number of clips, anything that needed attention (e.g. many `check` clips).
